<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UND Travel and Tours — Team Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #1C2B33;
    --ink-soft: #2E4552;
    --paper: #F6F3EC;
    --paper-raised: #FFFFFF;
    --line: #D8D2C2;
    --line-strong: #B9B29D;
    --amber: #B8892B;
    --amber-bg: #FBF1DC;
    --rust: #A23E2E;
    --rust-bg: #F7E7E3;
    --forest: #3F6B4F;
    --forest-bg: #E6EFE7;
    --text-dim: #6B6459;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}

  /* ---------- Login gate ---------- */
  #loginScreen{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center; justify-content:center; z-index:100;
  }
  .login-card{
    background:var(--paper); padding:48px 44px; width:320px; border-radius:2px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
    position:relative;
  }
  .login-card::before{
    content:""; position:absolute; left:28px; top:0; bottom:0; width:1px;
    background:repeating-linear-gradient(var(--line-strong) 0 6px, transparent 6px 12px);
  }
  .login-card h1{font-size:22px; margin-bottom:4px; padding-left:14px;}
  .login-card p{font-size:12.5px; color:var(--text-dim); margin:0 0 26px; padding-left:14px;}
  .login-card form{padding-left:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px;}
  .field input{width:100%; padding:10px 12px; border:1px solid var(--line-strong); background:var(--paper-raised); border-radius:3px; font-size:14px; font-family:'Inter',sans-serif;}
  .field input:focus{outline:2px solid var(--ink-soft); outline-offset:1px;}
  .btn{
    appearance:none; border:none; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:11px 18px; border-radius:3px; background:var(--ink); color:var(--paper); letter-spacing:.01em;
  }
  .btn:hover{background:var(--ink-soft);}
  .btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
  .btn.secondary:hover{background:var(--line);}
  header.top .btn.secondary{color:var(--paper); border-color:rgba(255,255,255,.45);}
  header.top .btn.secondary:hover{background:rgba(255,255,255,.12);}
  .btn.danger{background:var(--rust); color:#fff;}
  .btn.full{width:100%;}
  #loginError{color:var(--rust); font-size:12.5px; margin-top:10px; padding-left:14px; display:none;}

  /* ---------- Shell ---------- */
  #app{display:none;}
  header.top{
    background:var(--ink); color:var(--paper); padding:22px 32px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:4px solid var(--amber);
  }
  header.top .brand{display:flex; align-items:baseline; gap:12px;}
  header.top h1{font-size:24px; color:#fff;}
  header.top .tag{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:#9FB3BC;}
  header.top .status-dot{width:7px; height:7px; border-radius:50%; background:#5AA36B; display:inline-block; margin-right:6px; box-shadow:0 0 0 3px rgba(90,163,107,.25);}
  header.top .conn{font-size:11.5px; color:#B7C4CA; display:flex; align-items:center;}
  header.top .actions{display:flex; gap:10px; align-items:center;}

  /* ---------- Hamburger + side nav ---------- */
  .hamburger-btn{
    appearance:none; border:none; background:transparent; cursor:pointer; padding:6px; margin-right:2px;
    display:flex; flex-direction:column; gap:4px; justify-content:center;
  }
  .hamburger-btn span{width:20px; height:2px; background:var(--paper); display:block; border-radius:2px;}
  .side-nav{
    display:none; position:fixed; top:0; left:0; bottom:0; width:280px; background:var(--ink); z-index:80;
    box-shadow:10px 0 34px rgba(0,0,0,.35); flex-direction:column;
  }
  .side-nav.show{display:flex;}
  .side-nav-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 22px 18px; border-bottom:1px solid rgba(255,255,255,.12);
  }
  .side-nav-brand{display:flex; align-items:baseline; gap:9px;}
  .side-nav-brand .logo{font-family:'Fraunces',serif; font-size:19px; color:#fff; font-weight:600;}
  .side-nav-brand .sub{font-size:9.5px; text-transform:uppercase; letter-spacing:.09em; color:#8FA2AA;}
  .side-nav-close{
    appearance:none; border:none; background:transparent; color:#93A6AE; font-size:20px; line-height:1;
    cursor:pointer; padding:4px 6px; border-radius:3px;
  }
  .side-nav-close:hover{color:#fff; background:rgba(255,255,255,.08);}
  .side-nav-items{padding:14px 12px; display:flex; flex-direction:column; gap:2px;}
  .side-nav-item{
    display:flex; align-items:center; gap:12px; padding:12px 14px; color:#B7C4CA; font-size:13.5px;
    cursor:pointer; border-left:3px solid transparent; border-radius:4px; text-decoration:none;
    transition:background .12s, color .12s;
  }
  .side-nav-item .icon{
    width:26px; height:26px; border-radius:6px; background:rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
  }
  .side-nav-item:hover{background:rgba(255,255,255,.07); color:#fff;}
  .side-nav-item.active{
    color:#fff; border-left-color:var(--amber); background:rgba(255,255,255,.09); font-weight:600;
  }
  .side-nav-item.active .icon{background:var(--amber); color:var(--ink);}
  .side-nav-foot{
    margin-top:auto; padding:16px 22px; border-top:1px solid rgba(255,255,255,.1);
    font-size:10.5px; color:#7C8E96; letter-spacing:.03em;
  }
  .nav-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:70;}
  .nav-scrim.show{display:block;}

  /* ---------- Bank Statement folders ---------- */
  .bs-folders{display:flex; gap:20px; flex-wrap:wrap; padding:20px 0;}
  .bs-folder{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:6px; padding:28px 34px;
    text-align:center; cursor:pointer; min-width:180px; transition:box-shadow .15s, transform .15s;
  }
  .bs-folder:hover{box-shadow:0 10px 26px rgba(28,43,51,.12); transform:translateY(-2px);}
  .bs-folder-icon{font-size:40px; margin-bottom:10px;}
  .bs-folder-name{font-family:'Fraunces',serif; font-size:18px; font-weight:600;}
  .bs-folder-sub{font-size:12px; color:var(--text-dim); margin-top:6px; font-family:'IBM Plex Mono',monospace;}
  .bs-folder{position:relative;}
  .bs-folder-delete{
    position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%;
    border:1px solid var(--line); background:var(--paper-raised); color:var(--text-dim);
    font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .12s, background .12s, color .12s;
  }
  .bs-folder:hover .bs-folder-delete{opacity:1;}
  .bs-folder-delete:hover{background:var(--rust); color:#fff; border-color:var(--rust);}

  main{max-width:1180px; margin:0 auto; padding:28px 32px 60px;}

  /* ---------- Dashboard cards ---------- */
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:30px;}
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; padding:18px 20px; position:relative; overflow:hidden;
  }
  .card::before{content:attr(data-mark); position:absolute; right:14px; top:10px; font-family:'Fraunces',serif; font-size:34px; color:var(--line); font-weight:700; line-height:1;}
  .card .label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim); margin-bottom:8px;}
  .card .value{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600;}
  .card.total .value{color:var(--ink);}
  .card.collected .value{color:var(--forest);}
  .card.outstanding .value{color:var(--rust);}
  .card.overdue .value{color:var(--amber);}
  .card .sub{font-size:11.5px; color:var(--text-dim); margin-top:4px;}

  .aging-strip{display:flex; gap:1px; margin-top:12px; border-radius:3px; overflow:hidden; height:8px;}
  .aging-strip span{flex:1; background:var(--line);}

  .card.profit{padding-bottom:14px;}
  .profit-rows{margin-top:6px;}
  .profit-rows .p-row{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .profit-rows .p-row:last-child{border-bottom:none;}
  .profit-rows .p-row span:first-child{color:var(--text-dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;}
  .profit-rows .p-row span:last-child{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px;}
  .profit-rows .p-row.income span:last-child{color:var(--forest); font-size:17px;}
  .profit-rows .p-row.income.negative span:last-child{color:var(--rust);}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:14px; flex-wrap:wrap;}
  .toolbar .left{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-box{position:relative;}
  .search-box input{padding:9px 12px 9px 30px; border:1px solid var(--line-strong); border-radius:3px; font-size:13.5px; width:220px; background:var(--paper-raised); font-family:'Inter',sans-serif;}
  .search-box::before{content:"⌕"; position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:14px;}
  select.filter{padding:9px 10px; border:1px solid var(--line-strong); border-radius:3px; font-size:13px; background:var(--paper-raised); font-family:'Inter',sans-serif;}

  /* ---------- Ledger table ---------- */
  .ledger-wrap{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:4px; position:relative; overflow:hidden;
  }
  .ledger-wrap::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:34px; background:var(--ink);
  }
  table.ledger{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.ledger thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-dim);
    padding:14px 14px 12px; border-bottom:1px solid var(--line-strong); font-weight:600;
  }
  table.ledger thead th:first-child{padding-left:44px;}
  table.ledger tbody td{padding:13px 14px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.ledger tbody td:first-child{padding-left:44px; font-family:'IBM Plex Mono',monospace; color:var(--text-dim); font-size:12.5px;}
  table.ledger tbody tr{cursor:pointer; transition:background .12s;}
  table.ledger tbody tr:hover{background:#FAF8F2;}
  table.ledger tbody tr:last-child td{border-bottom:none;}
  td.amt{font-family:'IBM Plex Mono',monospace; text-align:right;}
  td.name{font-weight:600;}
  .remark-cell{color:var(--text-dim); font-size:12.5px; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .pill.paid{background:var(--forest-bg); color:var(--forest);}
  .pill.partial{background:var(--amber-bg); color:var(--amber);}
  .pill.unpaid{background:var(--rust-bg); color:var(--rust);}
  .aging-tag{font-size:11px; color:var(--text-dim); margin-left:6px;}
  .aging-tag.warn{color:var(--amber); font-weight:600;}
  .aging-tag.crit{color:var(--rust); font-weight:600;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--text-dim);}
  .empty-state h3{font-size:18px; margin-bottom:6px; color:var(--ink);}

  /* ---------- Modal ---------- */
  .overlay{position:fixed; inset:0; background:rgba(28,43,51,.55); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:40px 20px; overflow-y:auto;}
  .overlay.show{display:flex;}
  .modal{background:var(--paper); width:100%; max-width:520px; border-radius:5px; box-shadow:0 30px 70px rgba(0,0,0,.4); position:relative;}
  .modal-head{padding:22px 26px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start;}
  .modal-head h2{font-size:19px;}
  .modal-head .rn{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); margin-top:4px;}
  .modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-dim); line-height:1; padding:4px;}
  .modal-body{padding:22px 26px; max-height:60vh; overflow-y:auto;}
  .modal-foot{padding:16px 26px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}

  .ticket-strip{
    display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; background:var(--ink); color:var(--paper); border-radius:4px; padding:16px 18px; margin-bottom:20px;
  }
  .ticket-strip .t-block{flex:1; min-width:100px;}
  .ticket-strip .t-block .label{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:#9FB3BC; margin-bottom:4px;}
  .ticket-strip .t-block .val{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600;}
  .ticket-strip .t-block.bal .val{color:#F0C36D;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  textarea, .field input[type=text], .field input[type=number], .field input[type=date]{font-family:'Inter',sans-serif;}
  textarea{width:100%; border:1px solid var(--line-strong); border-radius:3px; padding:10px 12px; font-size:13.5px; font-family:'Inter',sans-serif; resize:vertical; min-height:60px;}

  .hist-list{list-style:none; margin:0; padding:0;}
  .hist-list li{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed var(--line);}
  .hist-list li:last-child{border-bottom:none;}
  .hist-list .hd{font-size:12.5px; color:var(--text-dim);}
  .hist-list .ha{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--forest);}
  .hist-empty{color:var(--text-dim); font-size:13px; padding:8px 0;}

  .add-payment-row{display:flex; gap:8px; margin-top:14px;}
  .add-payment-row input{flex:1; padding:9px 10px; border:1px solid var(--line-strong); border-radius:3px; font-size:13.5px;}

  /* ---------- Pie chart / progress ---------- */
  .progress-row{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
  .progress-text .pct{font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600;}
  .progress-text .lbl{font-size:11.5px; color:var(--text-dim);}
  .row-pie{display:inline-flex; vertical-align:middle; margin-left:6px;}

  /* ---------- Print-only statement ---------- */
  .print-only{display:none;}
  @media print{
    body > *:not(#printStatement){display:none !important;}
    #printStatement{display:block !important; padding:36px; font-family:'Inter',sans-serif; color:#111;}
    #printStatement h1{font-family:'Fraunces',serif; font-size:22px; margin-bottom:2px;}
    #printStatement table{width:100%; border-collapse:collapse; margin-top:16px;}
    #printStatement td, #printStatement th{padding:6px 4px; font-size:13px;}
    #printStatement .totals td{border-top:1px solid #333;}
    #printStatement tfoot td{border-top:1px solid #333; padding-top:8px;}
  }

  .section-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:18px 0 8px; font-weight:600;}
  .section-label:first-child{margin-top:0;}

  @media(max-width:760px){
    .cards{grid-template-columns:repeat(2,1fr);}
    header.top{padding:18px 18px;}
    main{padding:20px 14px 50px;}
    .grid2{grid-template-columns:1fr;}
    table.ledger{font-size:12.5px;}
    table.ledger th:nth-child(2), table.ledger td:nth-child(2),
    table.ledger th:nth-child(4), table.ledger td:nth-child(4),
    table.ledger th:nth-child(5), table.ledger td:nth-child(5){display:none;}
  }
  /* ---------- Chat ---------- */
  .chat-wrap{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
    display:flex; flex-direction:column; height:calc(100vh - 200px); min-height:420px;
  }
  .chat-messages{flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px;}
  .chat-bubble{max-width:72%; padding:10px 14px; border-radius:10px; background:var(--paper); border:1px solid var(--line);}
  .chat-bubble.mine{align-self:flex-end; background:var(--amber-bg); border-color:var(--amber);}
  .chat-meta{display:flex; gap:8px; align-items:baseline; margin-bottom:3px;}
  .chat-name{font-weight:700; font-size:12.5px;}
  .chat-role{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); background:var(--line); padding:1px 6px; border-radius:10px;}
  .chat-time{font-size:10.5px; color:var(--text-dim); margin-left:auto; font-family:'IBM Plex Mono',monospace;}
  .chat-text{font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word;}
  .chat-compose{display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line); background:var(--paper-raised);}
  .chat-compose textarea{
    flex:1; resize:none; padding:10px 12px; border:1px solid var(--line-strong); border-radius:4px;
    font-size:13.5px; font-family:'Inter',sans-serif; min-height:44px; max-height:120px;
  }
  .chat-empty{margin:auto; text-align:center; color:var(--text-dim); padding:40px;}
  .chat-view-only{padding:14px 20px; border-top:1px solid var(--line); background:var(--paper); text-align:center; font-size:12.5px; color:var(--text-dim);}

</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <h1>UND & JNH</h1>
    <p>Team Chat — staff access</p>
    <form id="loginForm">
      <div class="field">
        <label for="user">Username</label>
        <input type="text" id="user" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input type="password" id="pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn full">Sign in</button>
      <div id="loginError">Incorrect username or password.</div>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header class="top">
    <div class="brand">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <h1>UND & JNH</h1>
      <span class="tag">Team Chat</span>
    </div>
    <div class="actions">
      <span class="conn"><span class="status-dot" id="connDot"></span><span id="connText">Synced</span></span>
      <button class="btn secondary" id="myProfileBtn">My Profile</button>
      <button class="btn secondary" id="logoutBtn">Log out</button>
    </div>
  </header>

  <nav class="side-nav" id="sideNav">
    <div class="side-nav-head">
      <div class="side-nav-brand">
        <span class="logo">UND & JNH</span>
        <span class="sub">UND Travel &amp; Tours</span>
      </div>
      <button class="side-nav-close" id="navCloseBtn" aria-label="Close menu">&times;</button>
    </div>
    <div class="side-nav-items">
      <a href="index.html" class="side-nav-item"><span class="icon">📋</span>Accounts Receivable</a>
      <a href="ap.html" class="side-nav-item"><span class="icon">💳</span>Expenses</a>
      <a href="chat.html" class="side-nav-item active"><span class="icon">💬</span>Team Chat</a>
    </div>
    <div class="side-nav-foot">Signed in as Deilen75</div>
  </nav>
  <div class="nav-scrim" id="navScrim"></div>

  <main>
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Loading messages…</div>
      </div>
      <div class="chat-compose" id="chatCompose">
        <textarea id="chatInput" placeholder="Type a message…"></textarea>
        <button class="btn" id="chatSendBtn">Send</button>
      </div>
    </div>
  </main>
</div>

<!-- ================= MY PROFILE MODAL ================= -->
<div class="overlay" id="profileOverlay">
  <div class="modal">
    <div class="modal-head">
      <div><h2>My Profile</h2></div>
      <button class="modal-close" data-close="profileOverlay">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Username <span style="font-weight:400; color:var(--text-dim);">(used to log in — can't be changed here)</span></label>
        <input type="text" id="pf_username" readonly style="background:var(--paper); color:var(--text-dim);">
      </div>
      <div class="field">
        <label>Display Name <span style="font-weight:400; color:var(--text-dim);">(shown in Team Chat and elsewhere)</span></label>
        <input type="text" id="pf_display_name" placeholder="e.g. Deilen">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn secondary" data-close="profileOverlay">Cancel</button>
      <button class="btn" id="saveProfileBtn">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@neondatabase/neon-js/+esm";

/* ============================================================
   CONFIG — same Neon project/database as the other pages
   ============================================================ */
const NEON_DATA_API_URL = "https://ep-wispy-sound-atot4lsj.apirest.c-9.us-east-1.aws.neon.tech/neondb/rest/v1";
const NEON_AUTH_URL = "https://ep-wispy-sound-atot4lsj.neonauth.c-9.us-east-1.aws.neon.tech/neondb/auth";

const supabase = createClient({
  auth: { url: NEON_AUTH_URL, allowAnonymous: true },
  dataApi: { url: NEON_DATA_API_URL }
});

let currentUserRole = null; // 'staff' | 'admin' | 'superadmin'

/* ---------- Auth gate — same app_users login as index.html / ap.html ---------- */
const loginScreen = document.getElementById('loginScreen');
const appEl = document.getElementById('app');

function checkSession(){
  if(sessionStorage.getItem('ar_logged_in') === 'true'){
    currentUserRole = sessionStorage.getItem('ar_user_role');
    loginScreen.style.display = 'none';
    appEl.style.display = 'block';
    init();
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value;
  const submitBtn = e.target.querySelector('button[type=submit]');
  if(submitBtn) submitBtn.disabled = true;

  const { data, error } = await supabase.from('app_users').select('*').eq('username', u);

  if(submitBtn) submitBtn.disabled = false;

  const errEl = document.getElementById('loginError');
  if(error){
    errEl.textContent = 'Login error: ' + error.message;
    errEl.style.display = 'block';
    return;
  }

  const match = data && data.find(row => row.password === p);
  if(match){
    sessionStorage.setItem('ar_logged_in', 'true');
    sessionStorage.setItem('ar_user_role', match.role);
    sessionStorage.setItem('ar_username', match.username);
    errEl.style.display = 'none';
    checkSession();
  } else {
    errEl.textContent = 'Incorrect username or password.';
    errEl.style.display = 'block';
  }
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  sessionStorage.removeItem('ar_logged_in');
  sessionStorage.removeItem('ar_user_role');
  sessionStorage.removeItem('ar_username');
  location.reload();
});

/* ---------- My Profile (change display name, not the login username) ---------- */
const profileOverlay = document.getElementById('profileOverlay');
document.getElementById('myProfileBtn').addEventListener('click', async ()=>{
  const username = sessionStorage.getItem('ar_username');
  document.getElementById('pf_username').value = username || '';
  const { data } = await supabase.from('app_users').select('*').eq('username', username);
  const row = data && data[0];
  document.getElementById('pf_display_name').value = (row && row.display_name) || '';
  profileOverlay.classList.add('show');
});

document.getElementById('saveProfileBtn').addEventListener('click', async ()=>{
  const username = sessionStorage.getItem('ar_username');
  const displayName = document.getElementById('pf_display_name').value.trim();
  const { error } = await withRetry(() => supabase
    .from('app_users')
    .update({ display_name: displayName })
    .eq('username', username));
  if(error){
    alert('Could not save: ' + error.message);
    return;
  }
  profileOverlay.classList.remove('show');
  loadDisplayNames();
  loadChatMessages();
});

/* ---------- Helpers ---------- */
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
/* Retries a Supabase/Neon write once or twice if it fails from a rate
   limit (429 / "Too many requests"), instead of failing immediately. */
async function withRetry(fn, retries=2, delayMs=2000){
  for(let attempt=0; attempt<=retries; attempt++){
    const result = await fn();
    if(!result.error) return result;
    const msg = (result.error.message || '').toLowerCase();
    const isRateLimit = msg.includes('too many requests') || msg.includes('rate limit') || msg.includes('429');
    if(isRateLimit && attempt < retries){
      await new Promise(res=>setTimeout(res, delayMs * (attempt+1)));
      continue;
    }
    return result;
  }
}
function formatChatTime(iso){
  const d = new Date(iso);
  const datePart = d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  const timePart = d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  return `${datePart} · ${timePart}`;
}

/* ---------- Hamburger nav ---------- */
const sideNav = document.getElementById('sideNav');
const navScrim = document.getElementById('navScrim');
function openNav(){ sideNav.classList.add('show'); navScrim.classList.add('show'); }
function closeNav(){ sideNav.classList.remove('show'); navScrim.classList.remove('show'); }
document.getElementById('hamburgerBtn').addEventListener('click', openNav);
document.getElementById('navCloseBtn').addEventListener('click', closeNav);
navScrim.addEventListener('click', closeNav);

/* ============================================================
   Chat — one shared channel between Admin and Staff. Super Admin
   can see every message (oversight), and can also post if needed.
   ============================================================ */
let chatMessages = [];
let chatScrollWasAtBottom = true;
let displayNames = {}; // username -> display_name

async function loadDisplayNames(){
  const { data, error } = await supabase.from('app_users').select('username, display_name');
  if(!error && data){
    displayNames = {};
    data.forEach(u=>{ displayNames[u.username] = u.display_name; });
  }
}

function nameFor(username){
  const dn = displayNames[username];
  return (dn && dn.trim()) ? dn.trim() : username;
}

async function loadChatMessages(){
  const { data, error } = await supabase
    .from('chat_messages')
    .select('*')
    .order('created_at', {ascending:true});
  if(error){
    console.error(error);
    document.getElementById('connText').textContent = 'Connection error';
    document.getElementById('connDot').style.background = '#A23E2E';
    return;
  }
  chatMessages = data || [];
  renderChat();
}

function renderChat(){
  const wrap = document.getElementById('chatMessages');
  const myUsername = sessionStorage.getItem('ar_username');

  // Keep the scroll pinned to the bottom only if the user was already
  // near the bottom before this refresh — so someone scrolling up to
  // read old messages doesn't get yanked back down every 45 seconds.
  const nearBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;

  if(chatMessages.length === 0){
    wrap.innerHTML = '<div class="chat-empty">No messages yet — say hello.</div>';
    return;
  }

  wrap.innerHTML = chatMessages.map(m=>{
    const mine = m.sender_username === myUsername;
    return `
      <div class="chat-bubble${mine ? ' mine' : ''}">
        <div class="chat-meta">
          <span class="chat-name">${escapeHtml(nameFor(m.sender_username))}</span>
          <span class="chat-role">${escapeHtml(m.sender_role)}</span>
          <span class="chat-time">${formatChatTime(m.created_at)}</span>
        </div>
        <div class="chat-text">${escapeHtml(m.message)}</div>
      </div>`;
  }).join('');

  if(nearBottom || chatScrollWasAtBottom){
    wrap.scrollTop = wrap.scrollHeight;
  }
}

document.getElementById('chatSendBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if(!message) return;

  const payload = {
    sender_username: sessionStorage.getItem('ar_username'),
    sender_role: currentUserRole,
    message: message
  };

  input.value = '';
  const { error } = await withRetry(() => supabase.from('chat_messages').insert(payload));
  if(error){
    alert('Could not send: ' + error.message);
    return;
  }
  chatScrollWasAtBottom = true;
  await loadChatMessages();
});

document.getElementById('chatInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    document.getElementById('chatSendBtn').click();
  }
});

/* ---------- Modal close handlers ---------- */
document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.getElementById(btn.getAttribute('data-close')).classList.remove('show');
  });
});
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{
    if(e.target === ov) ov.classList.remove('show');
  });
});

/* ---------- Init ---------- */
async function refreshChat(){
  await loadDisplayNames();
  await loadChatMessages();
}

function init(){
  refreshChat();
  setInterval(refreshChat, 45000); // simple polling sync, same as the other pages
}

checkSession();
</script>
</body>
</html>
